# ==============================================================================
# SquidClamav Service Configuration (INSTREAM Streaming over TCP)
# ==============================================================================
# Connect to ClamAV over network TCP (Port 3310).
# Data is streamed in chunks via INSTREAM without shared filesystem volumes.
# Supports multiple backend IPs separated by commas for horizontal scaling.
clamd_ip clamav
clamd_port 3310

# Connection and scanning settings
timeout 5
maxsize 100M
scan_mode ScanAllExcept
multipart 1
safebrowsing 0
dnslookup 1
